<!-- Lógica de Navegação e Troca de Cenários -->
    <script>
        // Dados dos Cenários
        const scenarios = {
            pessimista: {
                tag: "Cenário Pessimista",
                tagClass: "bg-amber-500 text-slate-900",
                resgate: "R$ 1.808,40",
                rentabilidade: "+ 20,56%",
                cagr: "Média Composta: 6,43% a.a.",
                regraVenda: "1% de R$ 200.000,00",
                valorBruto: "R$ 2.000,00",
                descontoAdm: "- R$ 30,00",
                descontoImposto: "- R$ 134,60",
                valorLiquido: "R$ 1.808,40",
                evolucao: [
                    { periodo: "Aporte (Dia 1)", saldo: "R$ 1.500,00", lucro: "—", pct: "0,00%" },
                    { periodo: "Fim do Ano 1", saldo: "R$ 1.596,45", lucro: "+ R$ 96,45", pct: "+ 6,43%" },
                    { periodo: "Fim do Ano 2", saldo: "R$ 1.699,10", lucro: "+ R$ 102,65", pct: "+ 13,27%" },
                    { periodo: "Fim do Ano 3 (Resgate)", saldo: "R$ 1.808,40", lucro: "+ R$ 109,30", pct: "+ 20,56%" }
                ]
            },
            otimista: {
                tag: "Cenário Otimista",
                tagClass: "bg-emerald-500 text-white",
                resgate: "R$ 2.726,10",
                rentabilidade: "+ 81,74%",
                cagr: "Média Composta: 22,03% a.a.",
                regraVenda: "1% de R$ 300.000,00",
                valorBruto: "R$ 3.000,00",
                descontoAdm: "- R$ 45,00",
                descontoImposto: "- R$ 201,90",
                valorLiquido: "R$ 2.726,10",
                evolucao: [
                    { periodo: "Aporte (Dia 1)", saldo: "R$ 1.500,00", lucro: "—", pct: "0,00%" },
                    { periodo: "Fim do Ano 1", saldo: "R$ 1.830,45", lucro: "+ R$ 330,45", pct: "+ 22,03%" },
                    { periodo: "Fim do Ano 2", saldo: "R$ 2.233,70", lucro: "+ R$ 403,25", pct: "+ 48,91%" },
                    { periodo: "Fim do Ano 3 (Resgate)", saldo: "R$ 2.726,10", lucro: "+ R$ 492,40", pct: "+ 81,74%" }
                ]
            }
        };

        // Função para alternar entre as 4 Abas (com Autoplay e Pausa Automática do Vídeo)
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).classList.add('active');

            // Lógica do Vídeo: Toca ao abrir a aba e Pausa ao sair dela
            const videoEl = document.querySelector('#tab-video video');
            if (videoEl) {
                if (tabId === 'tab-video') {
                    videoEl.play().catch(err => {
                        console.log("Autoplay bloqueado pelo navegador até interação do usuário:", err);
                    });
                } else {
                    videoEl.pause();
                }
            }
        }

        // Função para alternar entre os Cenários
        function setScenario(type) {
            document.querySelectorAll('.scenario-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');

            const data = scenarios[type];

            // Atualiza métricas topo
            document.getElementById('metric-resgate').innerText = data.resgate;
            document.getElementById('metric-rentabilidade').innerText = data.rentabilidade;
            document.getElementById('metric-cagr').innerText = data.cagr;

            // Atualiza extrato
            const tagEl = document.getElementById('label-cenario-tag');
            tagEl.innerText = data.tag;
            tagEl.className = "text-xs px-2 py-0.5 rounded font-extrabold " + data.tagClass;

            document.getElementById('table-regra-venda').innerText = data.regraVenda;
            document.getElementById('table-valor-bruto').innerText = data.valorBruto;
            document.getElementById('table-desconto-adm').innerText = data.descontoAdm;
            document.getElementById('table-desconto-imposto').innerText = data.descontoImposto;
            document.getElementById('table-valor-liquido').innerText = data.valorLiquido;

            // Atualiza Tabela de Evolução
            const tbody = document.getElementById('table-body-evolucao');
            tbody.innerHTML = '';
            data.evolucao.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = row.periodo.includes('Resgate') ? 'bg-emerald-50 font-bold' : '';
                tr.innerHTML = `
                    <td class="py-2.5 px-4">${row.periodo}</td>
                    <td class="py-2.5 px-4">${row.saldo}</td>
                    <td class="py-2.5 px-4 text-emerald-600">${row.lucro}</td>
                    <td class="py-2.5 px-4 text-right font-bold">${row.pct}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Inicializa pré-selecionado no Cenário Otimista
        document.addEventListener('DOMContentLoaded', () => {
            setScenario('otimista');
        });
    </script>
